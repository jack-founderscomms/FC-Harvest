name: Harvest & Publish

on:
  schedule:
    # 7:05am UK time (UTC — BST is UTC+1 so this runs at 8:05am during summer)
    - cron: "5 7 * * 1-5"   # weekdays only
  workflow_dispatch:          # manual trigger from GitHub Actions UI

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Persist the SQLite DB between runs so items accumulate
      - name: Restore harvest DB cache
        uses: actions/cache@v4
        with:
          path: harvest.db
          key: harvest-db-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: harvest-db-${{ github.ref_name }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run harvest
        run: python run.py harvest
        env:
          PYTHONUNBUFFERED: "1"

      # docs/index.html is a hand-maintained, self-updating dashboard that
      # fetches live from GOV.UK/Parliament APIs in the browser — it does not
      # read from harvest.db. generate_static.py is a separate, unmaintained
      # code path; running it here overwrote the real dashboard, so it and
      # the commit-back step have been removed.

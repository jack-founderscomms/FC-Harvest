name: Probe (temporary)
on:
  push:
    branches: [claude/epic-galileo-5dwf5k]
    paths: [probe/**, .github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python probe/scripts/fetch_committees.py
      - name: Summarise
        run: |
          python - <<'PY'
          import json, collections
          d = json.load(open("probe/docs/committees.json"))
          print("generated", d["generated_at"], "items", len(d["items"]), "failed", d["failed"])
          c = collections.Counter((i["committee_id"], i["doc_type"]) for i in d["items"])
          for k in sorted(c): print(k, c[k])
          for dt in ("committee news", "committee report", "inquiry", "committee hearing", "committee correspondence", "government_response"):
              for i in [x for x in d["items"] if x["doc_type"] == dt][:3]:
                  print(f"[{dt}] {i['published_at'][:16]} | {i['title'][:90]} | {i['summary'][:60]} | {i['url'][:80]}")
          PY

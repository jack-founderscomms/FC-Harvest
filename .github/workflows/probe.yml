name: Probe committee endpoints (temporary)
on:
  push:
    branches: [claude/epic-galileo-5dwf5k]
    paths: [scripts/probe_committees.py, .github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/probe_committees.py
